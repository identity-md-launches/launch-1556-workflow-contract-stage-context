[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = []
dynamic_test_linking = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true

[fmt]
line_length = 120
